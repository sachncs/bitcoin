[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "btx"
version = "0.5.0"
description = "Extract and linearize ECDSA and Schnorr signatures (r, s, z) from Bitcoin transactions with pure-Python secp256k1"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Sachin", email = "sachncs@gmail.com" }]
maintainers = [{ name = "Sachin", email = "sachncs@gmail.com" }]
keywords = ["btx", "bitcoin", "secp256k1", "cryptography", "ecdsa", "schnorr", "signature"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security :: Cryptography",
    "Topic :: Internet",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = ["typer>=0.27.2,<1"]

[project.urls]
Homepage = "https://github.com/sachncs/btx"
Repository = "https://github.com/sachncs/btx"
Documentation = "https://github.com/sachncs/btx#readme"
"Bug Tracker" = "https://github.com/sachncs/btx/issues"
Changelog = "https://github.com/sachncs/btx/blob/main/CHANGELOG.md"

[project.optional-dependencies]
coincurve = ["coincurve>=21.0.0,<22"]
dev = ["hypothesis>=6.165.3,<7", "pytest>=9.1.1,<10", "pytest-cov>=7.1.0,<8", "pytest-benchmark>=5.2.3,<6", "ruff>=0.16.2,<1", "mypy>=2.3.0,<3", "pre-commit>=4.6.2,<5", "pip-audit>=2.10.1,<3", "sphinx>=9.1.0,<10"]
all = ["btx[coincurve,dev]"]

[project.scripts]
btx = "btx.cli:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["btx*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".venv", ".hypothesis", ".benchmarks", ".pytest_cache"]
addopts = "-q"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "I", "N"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B"]
"btx/curve/dispatch.py" = ["N806"]
"btx/signature/schnorr.py" = ["N806"]
"btx/signature/signer.py" = ["N806"]
"tests/test_attack.py" = ["N806"]
"tests/test_mainnet_vectors.py" = ["N806"]
"btx/psbt/parser.py" = ["I001"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
strict_equality = true

[[tool.mypy.overrides]]
module = "coincurve"
ignore_missing_imports = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
